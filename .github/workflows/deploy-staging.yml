name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit o rama a desplegar a staging'
        required: true
        default: 'main'
      message:
        description: 'Mensaje de la actualización OTA'
        required: false
        default: 'Actualización de staging'

permissions:
  contents: read

jobs:
  staging:
    name: Build y actualización de staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      - name: Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El proyecto de EAS se vincula una vez con `eas init`, que escribe
      # `extra.eas.projectId` en app.json. Sin ese identificador los builds
      # fallan con un error poco descriptivo, así que se comprueba antes.
      - name: Verificar que el proyecto está vinculado a EAS
        run: |
          set -euo pipefail
          if ! grep -q '"projectId"' app.json; then
            echo "::error::app.json no tiene extra.eas.projectId. Ejecuta 'npx eas-cli init' una vez y committea el resultado."
            exit 1
          fi

      - name: Verificar que hay credencial de EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Falta el secreto EXPO_TOKEN en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Una actualización OTA sólo llega a la app si el binario la tiene
      # activada. Como `ios/` está versionado y EAS no ejecuta prebuild, el
      # proyecto nativo commiteado es el que manda.
      - name: 'Verificar que el proyecto nativo tiene las actualizaciones activadas'
        run: |
          set -euo pipefail
          PLIST="ios/MiPensionL73/Supporting/Expo.plist"
          if [ ! -f "${PLIST}" ]; then
            echo "::error::No existe ${PLIST}. Regenera el proyecto nativo con 'npx expo prebuild --platform ios'."
            exit 1
          fi
          read_native() {
            python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb')).get(sys.argv[2],''))" "${PLIST}" "$1"
          }
          EXPECTED_URL=$(jq -r '.expo.updates.url // empty' app.json)
          NATIVE_URL=$(read_native 'EXUpdatesURL')
          NATIVE_ENABLED=$(read_native 'EXUpdatesEnabled')
          if [ "${NATIVE_ENABLED}" != "True" ]; then
            echo "::error::El proyecto nativo tiene EXUpdatesEnabled=${NATIVE_ENABLED}. La actualización OTA no llegaría a la app."
            echo "::error::Ejecuta 'npx expo prebuild --platform ios' después de configurar expo.updates.url en app.json."
            exit 1
          fi
          if [ "${NATIVE_URL}" != "${EXPECTED_URL}" ]; then
            echo "::error::El proyecto nativo apunta a '${NATIVE_URL}' y app.json a '${EXPECTED_URL}'."
            echo "::error::Ejecuta 'npx expo prebuild --platform ios' y commitea el resultado."
            exit 1
          fi
          echo "Proyecto nativo al día: actualizaciones hacia ${NATIVE_URL}"

      - name: Build de preview (iOS y Android)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@25.3.0 build --profile preview --platform all --non-interactive

      - name: Actualización OTA al canal staging
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ inputs.message }}
        run: npx eas-cli@25.3.0 update --channel staging --message "$MESSAGE" --non-interactive

      - name: Resumen
        run: |
          {
            echo "### Deploy a staging"
            echo
            echo "- Commit: \`${{ inputs.ref }}\` (\`${GITHUB_SHA}\`)"
            echo "- Canal OTA: \`staging\`"
            echo "- Mensaje: ${{ inputs.message }}"
          } >> "$GITHUB_STEP_SUMMARY"
